# Data Provenance and Sources

This file documents all external data sources used in this project, ensuring transparency and reproducibility.

## Format

Each source entry includes:
- **Source**: Full bibliographic citation
- **URL**: Direct link (if available)
- **Pages**: Specific pages or sections used
- **Date Accessed**: When data was extracted
- **License**: Usage rights and restrictions
- **Checksum**: SHA-256 hash (for verifiable files)
- **Usage**: How data is used in this project

---

## Primary Sources

### Mahadevan 1977 Sign List

- **Source**: Mahadevan, I. (1977). *The Indus Script: Texts, Concordance and Tables*. Archaeological Survey of India.
- **URL**: N/A (print publication)
- **Pages**: Tables I-IV (pp. 45-89)
- **Date Accessed**: 2025-01-15
- **License**: Fair use for academic research
- **Usage**: Symbol inventory (1-417), frequency data, position analysis
- **Notes**: Standard reference for Indus script sign list

### Farmer, Sproat & Witzel 2004

- **Source**: Farmer, S., Sproat, R., & Witzel, M. (2004). "The Collapse of the Indus-Script Thesis: The Myth of a Literate Harappan Civilization." *Electronic Journal of Vedic Studies*, 11(2), 19-57.
- **URL**: https://www.ejvs.laurasianacademy.com/issues.html
- **Pages**: All (open access)
- **Date Accessed**: 2025-12-10
- **License**: Open Access
- **Usage**: Critical analysis framework, non-linguistic perspective
- **Notes**: Influential skeptical view informing our non-phonetic approach

### Rao et al. 2009

- **Source**: Rao, R. P. N., Yadav, N., Vahia, M. N., Joglekar, H., Adhikari, R., & Mahadevan, I. (2009). "Entropic Evidence for Linguistic Structure in the Indus Script." *Science*, 324(5931), 1165.
- **URL**: https://doi.org/10.1126/science.1170391
- **Date Accessed**: 2025-11-20
- **License**: Copyright AAA, used under fair use
- **Usage**: Statistical measures, entropy analysis comparison
- **Notes**: Computational approach compatible with our framework

