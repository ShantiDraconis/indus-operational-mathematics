## Derived Data

All files in `/data/derived/` are generated from the sources above using scripts in `/code/scripts/`. 

### sign_inventory.csv

- **Generated From**: Mahadevan 1977, Tables I-II
- **Script**: `code/scripts/extract_tables.py`
- **Columns**: symbol_id, shape, class_inferred, frequency
- **License**: CC BY 4.0 (our derivative work)
- **Last Updated**: 2026-01-15

### frequencies.csv

- **Generated From**: Mahadevan 1977, Table II
- **Script**: `code/scripts/build_frequencies.py`
- **Columns**: symbol_id, count, percentage, rank
- **License**: CC BY 4.0
- **Last Updated**: 2026-01-15

### bigrams_topk.csv

- **Generated From**: Derived from Mahadevan corpus analysis
- **Script**: `code/scripts/build_bigrams.py`
- **Columns**: symbol_1, symbol_2, count, pmi
- **License**: CC BY 4.0
- **Last Updated**: 2026-01-18
- **Notes**: Top 100 bigrams by pointwise mutual information

