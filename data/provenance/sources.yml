## Reproducibility

To regenerate all derived data:

```bash
cd code/
python scripts/extract_tables.py
python scripts/build_frequencies.py
python scripts/build_bigrams.py
python scripts/validate_provenance.py
```

All scripts include source attribution in output files.

---

## Adding New Sources

When adding new data sources:

1. Add entry to this file following template
2. Update `code/scripts/validate_provenance.py`
3. Add checksum if verifiable file
4. Document in derived data files
5. Commit updated provenance

