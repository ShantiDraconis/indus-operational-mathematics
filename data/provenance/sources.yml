## Data Limitations

### Known Issues

1. **Incomplete Corpus**: Not all ~4000 inscriptions digitized
2. **Sign Variants**: Some symbols have multiple forms not fully captured
3. **Context Loss**: Archaeological context not always preserved in sign lists
4. **Dating Uncertainty**: Precise chronology for many inscriptions unclear

### Uncertainty Levels

We classify data reliability:
- **High**: Published sign lists, standard references (Mahadevan)
- **Medium**: Derived statistics, computational analysis
- **Low**: Hypothesized classifications, experimental features

### Missing Data

Not included in this repository:
- **Raw corpus images**: Copyright restrictions, size constraints
- **Complete site distributions**: Incomplete archaeological data
- **Seal photographs**: Available via archaeological institutions

