name: Reproducibility Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'code/scripts/**'
      - '.github/workflows/reproducibility.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'code/scripts/**'
  workflow_dispatch:

jobs:
  reproduce:
    name: Run Data Processing Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          
      - name: Run data extraction
        run: |
          python code/scripts/extract_tables.py
        if: false  # Disabled until scripts exist
        continue-on-error: true
        
      - name: Build bigrams
        run: |
          python code/scripts/build_bigrams.py
        if: false  # Disabled until scripts exist
        continue-on-error: true
        
      - name: Export figures
        run: |
          python code/scripts/export_figures.py
        if: false  # Disabled until scripts exist
        continue-on-error: true
        
      - name: Validate data provenance
        run: |
          python code/scripts/validate_provenance.py
        if: false  # Disabled until scripts exist
        continue-on-error: true
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: |
            data/derived/
            book/figures/generated/
        if: false  # Disabled until outputs exist
