[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indus-operational-mathematics"
version = "1.0.0"
description = "Formal framework for state-based symbol systems"
authors = [{name = "Draconis", email = "contact@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["indus", "operational-mathematics", "formal-methods", "ancient-scripts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.4.0",
    "pylint>=2.17.0",
]

notebooks = [
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
]

[project.urls]
Homepage = "https://github.com/ShantiDraconis/indus-operational-mathematics"
Documentation = "https://shantidraconis.github.io/indus-operational-mathematics"
Repository = "https://github.com/ShantiDraconis/indus-operational-mathematics"
Issues = "https://github.com/ShantiDraconis/indus-operational-mathematics/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=python --cov-report=html --cov-report=term"
